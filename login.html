<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion vendeur | Lapin de Daloa</title><link rel="stylesheet" href="admin.css"></head><body><div class="login"><div class="login-box"><div class="brand">🐇 Lapin de Daloa</div><h1>Espace vendeur</h1><p>Connectez-vous pour accéder à la gestion du stock.</p><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password"><button id="loginBtn">Se connecter</button><small id="loginError"></small><a href="index.html">← Retour au site</a></div></div><script>document.getElementById('loginBtn').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()};function login(){if(document.getElementById('password').value==='1234'){sessionStorage.setItem('lapinAdmin','1');location.href='dashboard.html'}else document.getElementById('loginError').textContent='Mot de passe incorrect.'}</script></body></html>
